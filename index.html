<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  html { color-scheme: dark; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: #1e1e1e;
    color: #d4d4d4;
    font-family: Consolas, "Courier New", monospace;
    font-size: 16px;
    line-height: 1.5;
    padding: clamp(28px, 10vh, 120px) clamp(20px, 6vw, 64px);
    box-sizing: border-box;

    touch-action: manipulation;
  }

  #term {
    width: 100%;
    max-width: 72ch;
    margin: 0 auto;
  }

  pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-family: inherit;
    font-size: inherit;
    margin: 0;
  }

  pre.nojs { max-width: 72ch; margin: 0 auto; }

  @media (max-width: 480px) {
    body { font-size: 14px; }
  }

  .line { min-height: 1.5em; }

  .user { color: #4ec9b0; font-weight: 600; }
  .at   { color: #d4d4d4; }
  .host { color: #4ec9b0; font-weight: 600; }
  .path { color: #569cd6; font-weight: 600; }
  .dollar { color: #d4d4d4; }
  .cmd  { color: #dcdcaa; }

  .chevron { color: #569cd6; }

  .ask { color: #569cd6; }

  .exec { color: #23d18b; font-weight: 600; }

  .number { color: #b5cea8; }

  .builtin { color: #dcdcaa; }

  .string { color: #ce9178; }

  .punct { color: #d4d4d4; }

  .op { color: #d4d4d4; }

  .dim { color: #808080; }

  .err { color: #f48771; }

  a.ret {
    color: #569cd6;
    text-decoration: underline;
    text-decoration-color: #444;
    text-underline-offset: 3px;
  }
  a.ret:hover, a.ret:focus-visible { color: #fff; text-decoration-color: #fff; }

  .caret {
    display: inline-block;
    position: relative;
    width: 0;
    height: 1.05em;
    vertical-align: text-bottom;
  }
  .caret::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 8px;
    height: 100%;
    background: #d4d4d4;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .caret::before { animation: none; } }

  .ghost {
    color: #5a5a5a;
    position: relative;
    z-index: 6;
    cursor: pointer;
  }

  img.construction {
    display: block;
    max-width: 100%;
    height: auto;
    margin: 0.3em 0;
  }

  img.catpic {
    display: block;
    max-width: 100%;
    height: auto;
    margin: 0.4em 0;
  }

  #sf {
    position: fixed;
    inset: 0;
    background: #1e1e1e;
    z-index: 10;
    pointer-events: none;
  }
  .sf-half {
    position: absolute;
    inset: 0;
    clip-path: inset(0 50% 0 0);
  }
  .sf-half.right { clip-path: inset(0 0 0 50%); }

  .sf-copy { animation: bob67 700ms ease-in-out infinite alternate; }

  .sf-half.right .sf-copy { animation-direction: alternate-reverse; }

  @keyframes bob67 {
    from { transform: translateY(-30px); }
    to   { transform: translateY(30px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .sf-copy { animation: none; }
  }

  #hint {
    position: fixed;
    right: 16px;
    bottom: 14px;
    color: #6a6a6a;
    font-size: 13px;
    letter-spacing: 0.02em;
    transition: opacity 0.35s ease;
    pointer-events: none;
    user-select: none;
  }
  #hint.gone { opacity: 0; }

  #entry {
    position: fixed;
    top: 0; left: 0;
    width: 1px; height: 1px;
    padding: 0; border: 0;
    background: transparent;

    color: transparent;
    -webkit-text-fill-color: transparent;
    caret-color: transparent;
    outline: none;
    font-size: 16px;
  }
  #entry.touch {
    width: 100%;
    height: 100%;
    z-index: 5;
    cursor: text;
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: pre;
    border: 0;
  }
</style>

  var timers = new Map();

  function sleep(ms) {
    if (reduce || skipped) { return Promise.resolve(); }
    if (fast) { ms = FAST_STEP_MS; }
    return new Promise(function (resolve) {
      var id = setTimeout(function () { timers.delete(id); resolve(); }, ms);
      timers.set(id, resolve);
    });
  }

  function drain() {
    timers.forEach(function (resolve, id) { clearTimeout(id); resolve(); });
    timers.clear();
  }

  function cancelRedirect() {
    if (redirectTimer) { clearTimeout(redirectTimer); redirectTimer = null; }
  }

  function skip() {
    if (redirected) { return; }

    if (!skipped) {
      skipped = true;
      drain();
      if (hint) { hint.classList.add("gone"); }
    }

    if (redirectTimer) {
      cancelRedirect();
      enterShell();
    }
  }

  function fastForward() {
    if (fast || skipped || redirected) { return; }

    if (redirectTimer) { skip(); return; }

    fast = true;

    drain();
    if (hint) { hint.classList.add("gone"); }
  }

  function onSkipInput(e) {
    if (e && e.key === "Enter") { fastForward(); } else { skip(); }
  }

  function armSkip() {
    window.addEventListener("keydown", onSkipInput);
    window.addEventListener("pointerdown", onSkipInput);

    window.addEventListener("touchstart", onSkipInput, { passive: true });
    window.addEventListener("wheel", onSkipInput, { passive: true });
  }
  function disarmSkip() {
    window.removeEventListener("keydown", onSkipInput);
    window.removeEventListener("pointerdown", onSkipInput);
    window.removeEventListener("touchstart", onSkipInput);
    window.removeEventListener("wheel", onSkipInput);

  var PROMPT =

    '<span class="host">ord3</span><span class="path">:~</span>' +
    '<span class="dollar">$</span> ';

  function attachInput(d, withGhost) {
    var input = document.createElement("span");
    var caret = document.createElement("span");
    caret.className = "caret";
    d.appendChild(input);
    d.appendChild(caret);
    var ghost = null;
    if (withGhost) {
      ghost = document.createElement("span");
      ghost.className = "ghost";

      ghost.addEventListener("pointerdown", function (e) {
        e.preventDefault();
        acceptSuggestion();
        try { entry.focus({ preventScroll: true }); } catch (err) { entry.focus(); }
      });
      d.appendChild(ghost);
    }
    term.appendChild(d);
    scrollDown();
    return { line: d, input: input, caret: caret, ghost: ghost };
  }

  var REPL = '<span class="chevron">&gt;&gt;&gt;</span> ';

  function makeLine(html, ghost) {
    var d = document.createElement("div");
    d.className = "line";
    d.innerHTML = html;
    return attachInput(d, ghost);
  }

  function output(parts, silent) {
    var d = document.createElement("div");
    d.className = "line";
    paint(d, parts);
    hang(d, parts);
    term.appendChild(d);
    if (live && !silent) { live.textContent = d.textContent; }
    scrollDown();
    return d;
  }

  function hang(d, parts) {
    var n = leadingSpaces(parts);
    if (n > 0) {
      d.style.paddingLeft = n + "ch";
      d.style.textIndent = "-" + n + "ch";
    }
    return d;
  }

  function leadingSpaces(parts) {
    if (typeof parts === "string") { parts = [[parts, null]]; }
    var n = 0;
    for (var i = 0; i < parts.length; i++) {
      var t = parts[i][0];
      for (var j = 0; j < t.length; j++) {
        if (t.charAt(j) !== " ") { return n; }
        n++;
      }
    }
    return n;
  }

  function announce(text) { if (live) { live.textContent = text; } }

  function paint(parent, parts) {
    if (typeof parts === "string") { parts = [[parts, null]]; }
    parts.forEach(function (part) {
      var span = document.createElement("span");
      if (part[1]) { span.className = part[1]; }
      span.textContent = part[0];
      parent.appendChild(span);
    });
    return parent;
  }

  function entryLine(label, text, href, brackets) {
    var d = document.createElement("div");
    d.className = "line";
    hang(d, [["  ", null]]);
    d.appendChild(document.createTextNode("  " + pad(label, 10)));
    if (brackets) { d.appendChild(span("<", "dim")); }
    d.appendChild(linkNode(text, href));
    if (brackets) { d.appendChild(span(">", "dim")); }
    term.appendChild(d);
    if (live) { live.textContent = label + " " + text; }
    scrollDown();
    return d;
  }

  function span(text, cls) {
    var s = document.createElement("span");
    if (cls) { s.className = cls; }
    s.textContent = text;
    return s;
  }

  function linkNode(text, href) {
    var a = document.createElement("a");
    a.className = "ret";
    a.href = href;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = text;
    return a;
  }

  function richLine(items) {
    var d = document.createElement("div");
    d.className = "line";
    items.forEach(function (it) {
      d.appendChild(typeof it === "string" ? document.createTextNode(it) : it);
    });
    term.appendChild(d);
    scrollDown();
    return d;
  }

  function dropCaret(slot) {
    if (slot && slot.caret && slot.caret.parentNode) {
      slot.caret.parentNode.removeChild(slot.caret);
    }
    if (slot && slot.ghost && slot.ghost.parentNode) {
      slot.ghost.parentNode.removeChild(slot.ghost);
    }
  }

  function scrollDown() {
    if (document.documentElement.scrollHeight > window.innerHeight) {
      window.scrollTo(0, document.documentElement.scrollHeight);
    }
  }

  function pad(text, width) {
    var s = String(text);
    while (s.length < width) { s += " "; }
    return s;
  }

  function padLeft(text, width) {
    var s = String(text);
    while (s.length < width) { s = " " + s; }
    return s;
  }

  function type(slot, parts) {
    if (typeof parts === "string") { parts = [[parts, "cmd"]]; }

    var plan = [];
    parts.forEach(function (part) {
      var s = document.createElement("span");
      if (part[1]) { s.className = part[1]; }
      slot.input.appendChild(s);
      for (var i = 0; i < part[0].length; i++) {
        plan.push({ el: s, ch: part[0].charAt(i) });
      }
    });

    return new Promise(function (resolve) {
      if (!plan.length) { resolve(); return; }
      var i = 0;
      (function step() {
        plan[i].el.textContent += plan[i].ch;
        i++;
        scrollDown();

        if (skipped || fast) {
          for (var j = i; j < plan.length; j++) { plan[j].el.textContent += plan[j].ch; }
          resolve();
          return;
        }
        if (i >= plan.length) { resolve(); return; }
        sleep(CHAR_MS).then(step);
      })();
    });
  }

  function submit(slot, text) {
    return type(slot, text).then(function () {
      return sleep(90 + Math.random() * 120);
    }).then(function () {
      dropCaret(slot);
    });
  }

  function w3fMessage(d) {
    if (!d) { return ""; }

  function messageFlow() {

  var CAT_COUNT = 10;
  var lastCat = 0;

  function pickCat() {
    var n = 1 + Math.floor(Math.random() * CAT_COUNT);
    if (n === lastCat) { n = (n % CAT_COUNT) + 1; }
    lastCat = n;
    return n;
  }

  function bar(pct, width) {
    var filled = Math.round(width * pct / 100);
    var s = "";
    for (var i = 0; i < width; i++) { s += i < filled ? "=" : " "; }
    if (filled > 0 && filled < width) {
      s = s.slice(0, filled - 1) + ">" + s.slice(filled);
    }
    return "[" + s + "]";
  }

  var CAT_MIN_MS = 800;

  function catPicture() {

    return new Promise(function (resolve) {
    var n = pickCat();
    var src = "cats/cat-" + n + ".jpg";
    var name = "cat-" + n + ".jpg";

    var line = document.createElement("div");
    line.className = "line";
    term.appendChild(line);

    var started = Date.now();
    var finished = false;
    var ticker = null;

    function draw(pct, tail) {
      line.textContent = pad(name, 12) + padLeft(pct, 3) + "%" +
                         bar(pct, 20) + (tail ? "  " + tail : "");
    }
    draw(0);
    announce("downloading " + name);
    scrollDown();

    function finish() {
      if (finished) { return; }
      finished = true;
      if (ticker) { clearInterval(ticker); }

      var secs = ((Date.now() - started) / 1000).toFixed(2);
      var size = "";
      try {
        var abs = src;
        try { abs = new URL(src, window.location.href).href; } catch (e2) {  }
        var hits = window.performance.getEntriesByName(abs);
        var entry = hits[hits.length - 1];
        if (entry && entry.encodedBodySize) {
          size = (entry.encodedBodySize / 1024).toFixed(1) + "K  ";
        }
      } catch (e3) {  }
      draw(100, size + "in " + secs + "s");

      var holder = document.createElement("div");
      holder.className = "line";
      var img = document.createElement("img");
      img.className = "catpic";
      img.alt = "a cat";
      img.onload = scrollDown;
      img.src = src;
      holder.appendChild(img);
      term.appendChild(holder);
      announce("a picture of a cat");
      scrollDown();
      resolve();
    }

    var probe = new Image();
    probe.onload = function () {
      var left = CAT_MIN_MS - (Date.now() - started);
      setTimeout(finish, left > 0 ? left : 0);
    };
    probe.onerror = function () {
      if (finished) { return; }
      finished = true;
      if (ticker) { clearInterval(ticker); }
      line.className = "line err";
      line.textContent = "cat: no cats available right now";
      announce("cat: no cats available right now");
      resolve();
    };

    ticker = setInterval(function () {
      if (finished) { return; }
      var t = Math.min(1, (Date.now() - started) / CAT_MIN_MS);
      draw(Math.min(95, Math.round(t * 95)));
    }, 60);

    probe.src = src;
    });

  function runMessageFlow() {
    return messageFlow().catch(function (err) {

  function deliver(answers) {
    if (!WEB3FORMS_KEY) {
      return pause(700).then(function () {
        output([["sent. thanks.", null]]);
        output([["(no access key set, so nothing actually sent)", "dim"]]);
      });
    }

    output([["sending...", "dim"]]);

    var ac = typeof AbortController !== "undefined" ? new AbortController() : null;
    var timer = setTimeout(function () { if (ac) { ac.abort(); } }, 15000);

    var fields = {
      access_key: WEB3FORMS_KEY,
      subject: "ord3.com: a message",
      from_name: "send-message.py",
      message: answers.message
    };
    if (answers.name) { fields.name = answers.name; }
    if (answers.email.replace(/\s+/g, "")) { fields.email = answers.email.trim(); }

    var opts = {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify(fields)
    };
    if (ac) { opts.signal = ac.signal; }

    return fetch(WEB3FORMS_URL, opts).then(function (r) {
      clearTimeout(timer);
      return r.text().then(function (body) {
        var d = {};
        try { d = JSON.parse(body); } catch (e) {  }
        if (r.ok) {
          output([["sent. thanks.", null]]);
        } else {
          output([["send-message.py: " +
                   (w3fMessage(d) || "could not send (" + r.status + ")"), "err"]]);
        }
      });
    }).catch(function (err) {
      clearTimeout(timer);
      output([["send-message.py: " +
               (err && err.name === "AbortError" ? "timed out"
                                                 : "could not reach the server"),
               "err"]]);
    });
  }

  var COMMANDS = [
    {
      name: "help",
      desc: "list every command",
      run: function () {
        output([["available commands:", "dim"]]);
        visible().forEach(function (c) {
          output([["  " + pad(c.name, 13) + c.desc, null]]);
        });
      }
    },
    {
      name: "contact",
      desc: "how to reach me",
      run: function () { printContact(); }
    },
    {
      name: "whoami",
      desc: "who is behind all this",
      run: function () {
        output([["Shreevardhan T V", null]]);
        entryLine("web", "shreevardhan.net", REDIRECT_TO);
        entryLine("also", "trimpta.com", TRIMPTA_TO);
      }
    },
    {
      name: "ord3",
      desc: "what this domain actually is",
      run: function () { printConstruction(); }
    },
    {
      name: "src",
      alias: "source",
      desc: "the source for this page",
      run: function () {
        entryLine("source", "github.com/trimpta/ord3",
                  "https://github.com/trimpta/ord3");
      }
    },
    {
      name: "python3",
      desc: "run a python script",
      run: function (args) {
        if (!args.length) {
          output([["usage: python3 <script>", "dim"]]);
          return;
        }
        var script = args[0].replace(/^\.\//, "");
        if (script === "send-message.py") { return runMessageFlow(); }
        var why = Object.prototype.hasOwnProperty.call(FILES, script)
          ? "not a python script"
          : "[Errno 2] No such file or directory";
        output([["python3: can't open file '" + args[0] + "': " + why, "err"]]);
      }
    },
    {
      name: "ls",
      desc: "list the files",
      run: function () {

        fileNames().forEach(function (f) {
          output([[f, isExecutable(f) ? "exec" : null]]);
        });
        output([["", null]]);
        output([["`cat <file>` to read one", "dim"]]);
      }
    },
    {
      name: "cat",
      desc: "print a file",
      run: function (args) {
        if (!args.length) {
          output([["cat: missing operand", "err"]]);
          output([["usage: cat <file>  --  see `ls`", "dim"]]);
          return catPicture();
        }

        var name = args[0].replace(/^\.\//, "");
        if (!Object.prototype.hasOwnProperty.call(FILES, name)) {
          output([["cat: " + args[0] + ": No such file or directory", "err"]]);
          output([["see `ls` for the files that do exist", "dim"]]);
          return;
        }
        FILES[name]();
      }
    },
    {
      name: "history",
      desc: "the commands you have run",
      run: function () {
        var start = history.length > 20 ? history.length - 20 : 0;
        if (start > 0) { output([["\u2026", "dim"]]); }
        for (var i = start; i < history.length; i++) {
          output([[pad(String(i + 1), 5) + history[i], "dim"]], true);
        }
        announce(history.length + " commands run this session: " +
                 history.slice(start).join(", "));
      }
    },

    {
      name: "./send-message.py",
      desc: "",
      hidden: true,
      run: function () { return runMessageFlow(); }
    },
    {
      name: "./surprise-me",
      desc: "",
      hidden: true,
      run: function () {
        output([["\u2192 files.catbox.moe/kd5suc.mp4", "dim"]]);
        redirectTimer = setTimeout(function () { redirect(SURPRISE_TO); }, 500);
        return false;
      }
    },
    {
      name: "replay",
      desc: "play the intro again",
      run: function () { replay(); return false; }
    },
    {
      name: "clear",
      desc: "clear the screen",
      run: function () { clearScreen(); return false; }
    },
    {
      name: "exit",
      desc: "continue to shreevardhan.net",
      run: function () {
        output([["\u2192 shreevardhan.net", "dim"]]);
        redirectTimer = setTimeout(redirect, 400);
        return false;
      }
    },

    {
      name: "67",
      alias: "sixseven",
      desc: "",
      hidden: true,
      run: function () {
        if (reduce) { return; }
        start67();
        return pause(3200).then(function () { stop67(); });
      }
    },
    {
      name: "sudo",
      desc: "",
      hidden: true,
      run: function () {
        output([["trimpta is not in the sudoers file.  " +
                 "This incident has been reported.", "err"]]);
      }
    }
  ];

  var shellMode = false;
  var busy = false;
  var active = null;
  var ask = null;
  var history = [];
  var histIdx = 0;
  var draft = "";

  function parseCommand(words) {
    for (var n = Math.min(words.length, 3); n >= 1; n--) {
      var name = words.slice(0, n).join(" ");
      for (var i = 0; i < COMMANDS.length; i++) {
        var c = COMMANDS[i];
        if (c.name === name || c.alias === name) {
          return { cmd: c, args: words.slice(n) };
        }
      }
    }
    return null;
  }

  function visible() {
    return COMMANDS.filter(function (c) { return !c.hidden; });
  }

  function isExecutable(name) {
    return !!parseCommand(["./" + name]);
  }

  var FILE_ARG_COMMANDS = {
    "cat": function () { return true; },
    "python3": function (name) { return /\.py$/.test(name); }
  };

  function completeFile(partial, accept) {
    var hit = fileNames().filter(function (n) {
      return n.indexOf(partial) === 0 && n.length > partial.length &&
             (!accept || accept(n));
    })[0];
    return hit ? hit.slice(partial.length) : "";
  }

  function completePath(partial, accept) {
    return completeFile(partial.indexOf("./") === 0 ? partial.slice(2) : partial,
                        accept);
  }

  function suggestion(value) {
    if (ask) { return ""; }
    if (value === "") { return shellMode ? "help" : ""; }

    if (value === ".") { return "/"; }
    if (value.indexOf("./") === 0) { return completePath(value); }

    var words = value.split(/\s+/);
    if (words.length > 1 &&
        Object.prototype.hasOwnProperty.call(FILE_ARG_COMMANDS, words[0])) {
      return completePath(words[words.length - 1], FILE_ARG_COMMANDS[words[0]]);
    }

    var matches = visible().filter(function (c) {
      return c.name.indexOf(value) === 0 && c.name.length > value.length;
    });
    return matches.length ? matches[0].name.slice(value.length) : "";
  }

  function renderEntry() {
    if (!active) { return; }
    var value = entry.value;
    active.input.textContent = value;
    if (active.ghost) { active.ghost.textContent = suggestion(value); }
    scrollDown();
  }

  function acceptSuggestion() {
    var rest = suggestion(entry.value);
    if (!rest) { return false; }
    entry.value += rest;
    renderEntry();
    return true;
  }

  function focusEntry() {
    if (!shellMode) { return; }

    if (touch) { return; }
    if (document.activeElement === entry) { return; }
    try { entry.focus({ preventScroll: true }); } catch (e) { entry.focus(); }
  }

  function promptNew() {
    active = makeLine(PROMPT, true);
    busy = false;
    entry.value = "";
    histIdx = history.length;
    draft = "";
    renderEntry();
    focusEntry();
  }

  function askLine(label) {
    var d = document.createElement("div");
    d.className = "line";
    d.appendChild(span(label, "ask"));
    return attachInput(d, false);
  }

  function question(label) {
    return new Promise(function (resolve, reject) {
      ask = { resolve: resolve, reject: reject };
      active = askLine(label);
      busy = false;
      entry.value = "";
      renderEntry();
      focusEntry();
      keepVisible();
    });
  }

  function clearScreen() {
    term.innerHTML = "";
    active = null;
    promptNew();
  }

  function onEntryKey(e) {
    if (!shellMode) { return; }

    if (busy) { e.preventDefault(); return; }

    if (e.key === "Enter") {
      e.preventDefault();
      submitEntry();
    } else if (e.key === "Tab") {
      e.preventDefault();
      acceptSuggestion();
    } else if (e.key === "ArrowRight") {

      if (acceptSuggestion()) { e.preventDefault(); }
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      recall(-1);
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      recall(1);
    } else if (e.key === "c" && e.ctrlKey) {
      e.preventDefault();
      cancelLine();
    } else if (e.key === "l" && e.ctrlKey) {
      e.preventDefault();
      clearScreen();
    }
  }

  function recall(dir) {
    if (ask) { return; }
    if (!history.length) { return; }
    if (histIdx === history.length) { draft = entry.value; }
    var i = histIdx + dir;
    if (i < 0) { i = 0; }
    if (i > history.length) { i = history.length; }
    histIdx = i;
    entry.value = i === history.length ? draft : history[i];
    renderEntry();
  }

  function cancelLine() {
    if (!active) { return; }
    dropCaret(active);
    active.line.appendChild(span("^C", "dim"));

    if (ask) {
      var pending = ask;
      ask = null;
      active = null;
      pending.reject({ cancelled: true });
      return;
    }
    promptNew();
  }

  function onEntryInput() {
    if (busy) { entry.value = ""; return; }
    renderEntry();
  }

  function submitEntry() {
    if (busy) { return; }

    if (ask) {
      var pending = ask;
      ask = null;
      var answer = entry.value;
      dropCaret(active);
      active = null;
      entry.value = "";
      pending.resolve(answer);
      return;
    }

    var typed = entry.value;
    var command = typed.replace(/^\s+|\s+$/g, "");
    dropCaret(active);
    active = null;
    entry.value = "";

    if (command === "") { promptNew(); return; }

    history.push(command);
    histIdx = history.length;
    if (live) { live.textContent = command; }

    var words = command.split(/\s+/);
    var parsed = parseCommand(words);
    if (!parsed) {
      output([["bash: " + command + ": command not found", "err"]]);
      var bare = command.replace(/^\.\//, "");
      if (Object.prototype.hasOwnProperty.call(FILES, bare)) {
        output([["did you mean ./" + bare + "?", "dim"]]);
      } else {
        output([["run `help` to see the available commands", "dim"]]);
      }
      promptNew();
      return;
    }

    busy = true;

    var result = parsed.cmd.run(parsed.args, command);
    if (result && typeof result.then === "function") {
      result.then(function (keep) { if (keep !== false) { promptNew(); } });
    } else if (result !== false) {
      promptNew();
    }
  }

  function enterShell() {
    if (shellMode) { return; }
    shellMode = true;
    skipped = true;
    fast = false;
    disarmSkip();
    if (hint) { hint.classList.add("gone"); }
    promptNew();

    window.addEventListener("pointerdown", focusEntry);
  }

  function session() {
    return sleep(650)
      .then(function () {
        var sh = makeLine(PROMPT, false);

        return submit(sh, "python3").then(function () {
          return sleep(500);
        });
      })
      .then(function () {

        output([["Python 3.14.6 (main, Jun 10 2026, 10:26:10) " +
                 "[GCC 13.3.0] on linux", null]]);
        output([['Type "help", "copyright", "credits" or "license" ' +
                 "for more information.", null]]);
      })
      .then(function () {
        var r = makeLine(REPL, false);
        return sleep(PROMPT_MS).then(function () {
          return type(r, ordCall());
        }).then(function () {
          dropCaret(r);
          return sleep(300);
        });
      })
      .then(function () {
        output([["51", "number"]]);
      })
      .then(function () {
        var r = makeLine(REPL, false);
        return sleep(PROMPT_MS).then(function () {
          return type(r, arithmetic());
        }).then(function () {
          dropCaret(r);
          return sleep(300);
        });
      })
      .then(function () {
        output(tuple67());
      })
      .then(function () {
        var r = makeLine(REPL, false);
        return sleep(PROMPT_MS).then(function () {
          return submit(r, "exit()");
        }).then(function () {
          return sleep(260);
        });
      })
      .then(function () {
        var sh = makeLine(PROMPT, false);
        return submit(sh, "python3 -m http.server 80").then(function () {
          return sleep(520);
        });
      })
      .then(function () {
        output([["Serving HTTP on 0.0.0.0 port 80 (http://0.0.0.0:80/) ...", "dim"]]);
        return sleep(900);
      })
      .then(function () {

        if (skipped || fast) { enterShell(); return; }
        redirectTimer = setTimeout(redirect, reduce ? 1500 : 1100);
      });
  }

  function start67() {
    if (document.getElementById("sf")) { return; }

    var rect = term.getBoundingClientRect();
    var wrap = document.createElement("div");
    wrap.id = "sf";

    ["left", "right"].forEach(function (which) {
      var half = document.createElement("div");
      half.className = "sf-half " + which;

      var copy = term.cloneNode(true);
      copy.removeAttribute("id");
      copy.className = "sf-copy";

      copy.style.position = "absolute";
      copy.style.top = rect.top + "px";
      copy.style.left = rect.left + "px";
      copy.style.width = rect.width + "px";
      copy.style.margin = "0";

      half.appendChild(copy);
      wrap.appendChild(half);
    });

    document.body.appendChild(wrap);
    term.style.visibility = "hidden";
  }

  function stop67() {
    var wrap = document.getElementById("sf");
    if (wrap && wrap.parentNode) { wrap.parentNode.removeChild(wrap); }
    term.style.visibility = "";
  }

  function replay() {
    shellMode = false;
    skipped = false;
    fast = false;
    redirected = false;
    cancelRedirect();
    term.innerHTML = "";
    active = null;
    entry.value = "";
    entry.blur();
    if (hint) { hint.classList.remove("gone"); }
    armSkip();
    session();
  }

  function staticLine(html, parts) {
    var slot = makeLine(html, false);
    paint(slot.input, parts);
    dropCaret(slot);
    return slot;
  }

  function renderStatic() {
    skipped = true;
    disarmSkip();
    drain();
    if (hint) { hint.classList.add("gone"); }
    term.innerHTML = "";

    staticLine(PROMPT, [["python3", "cmd"]]);
    staticLine(REPL, ordCall());
    output([["51", "number"]]);
    staticLine(REPL, arithmetic());
    output(tuple67());
    staticLine(REPL, [["exit()", "cmd"]]);
    staticLine(PROMPT, [["python3 -m http.server 80", "cmd"]]);
    output([["Serving HTTP on 0.0.0.0 port 80 (http://0.0.0.0:80/) ...", "dim"]]);

    enterShell();
  }

  var returning = false;

  try {
    var nav = window.performance && performance.getEntriesByType
      ? performance.getEntriesByType("navigation")[0]
      : null;
    if (nav && nav.type === "back_forward") { returning = true; }
  } catch (e) {  }

  window.addEventListener("pageshow", function (e) {
    if (e.persisted) { renderStatic(); }
  });

  window.addEventListener("resize", scrollDown);
  entry.addEventListener("input", onEntryInput);
  entry.addEventListener("keydown", onEntryKey);

  entry.addEventListener("blur", function () {
    if (touch || !shellMode || redirected) { return; }
    setTimeout(function () {
      if (shellMode && document.activeElement !== entry) {
        try { entry.focus({ preventScroll: true }); } catch (e) { entry.focus(); }
      }
    }, 0);
  });

  function keepVisible() {
    if (!active || !active.line || !active.line.getBoundingClientRect) { return; }
    var r = active.line.getBoundingClientRect();
    var view = window.visualViewport ? window.visualViewport.height
                                     : window.innerHeight;
    if (r.bottom > view || r.top < 0) {
      active.line.scrollIntoView({ block: "nearest" });
    }
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", keepVisible);
  }

  if (touch) {
    entry.classList.add("touch");

    if (hint) { hint.textContent = "tap anywhere to skip"; }
  }

  if (returning) {
    renderStatic();
  } else {
    armSkip();
    session();
  }
})();
</script>
